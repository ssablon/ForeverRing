<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CurseForge — Forever Mouse Ring-Range</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #111; color: #eee; max-width: 820px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    a.btn { display: inline-block; background: #f16436; color: #fff; padding: 10px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .field { margin: 18px 0; }
    label { display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 6px; }
    textarea, input { width: 100%; background: #1c1c1c; color: #fff; border: 1px solid #444; padding: 8px; box-sizing: border-box; }
    img.logo { width: 160px; height: 160px; object-fit: cover; border: 1px solid #444; border-radius: 8px; }
    button { margin-top: 6px; }
    .hint { color: #9ad; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>CurseForge project — Forever Mouse Ring-Range (Multi language)</h1>
  <p class="hint">1. Open Create Project → 2. Copy each field → 3. Upload the logo. Do not put “WoW” in the project name.</p>
  <p><a class="btn" href="https://authors.curseforge.com/#/projects/create/general" target="_blank" rel="noopener">Open Create Project</a></p>

  <div class="field">
    <label>Project name</label>
    <input id="name" value="Forever Mouse Ring-Range (Multi language)" readonly />
    <button type="button" data-copy="name">Copy</button>
  </div>

  <div class="field">
    <label>Slug</label>
    <input id="slug" value="forever-mouse-ring-range" readonly />
    <button type="button" data-copy="slug">Copy</button>
  </div>

  <div class="field">
    <label>Logo</label>
    <img class="logo" src="logo-512.png" alt="Forever Mouse Ring-Range" />
    <p class="hint">F:\Github\addons\wow\ForeverRing\curseforge\logo-512.png</p>
  </div>

  <div class="field">
    <label>Summary (English)</label>
    <textarea id="summary" rows="3" readonly>Forever Mouse Ring-Range (Multi language) — cursor ring with range and cast progress for Forever Classic. Never casts. 11 languages.</textarea>
    <button type="button" data-copy="summary">Copy</button>
  </div>

  <div class="field">
    <label>Main category</label>
    <input value="Combat" readonly />
  </div>

  <div class="field">
    <label>License</label>
    <input value="All Rights Reserved. © Vohnka — https://wow-forever.fr" readonly />
  </div>

  <script>
    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var el = document.getElementById(btn.getAttribute("data-copy"));
        if (!el) return;
        navigator.clipboard.writeText(el.value);
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = "Copy"; }, 1200);
      });
    });
  </script>
</body>
</html>
